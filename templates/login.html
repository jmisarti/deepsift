<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Deep Prospect CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="container">
        <section class="panel" style="max-width:520px;margin:3rem auto;">
            <h2>Deep Prospect CRM Login</h2>
            <p>Sign in to access the CRM.</p>
            {% if config_warning %}
            <div class="error-banner">{{ config_warning }}</div>
            {% endif %}
            {% if error %}
            <div class="error-banner">{{ error }}</div>
            {% endif %}
            <form method="post" class="grid-form">
                <input type="hidden" name="next" value="{{ next_target or '' }}">
                <label class="span2">Username
                    <input name="username" autocomplete="username" required>
                </label>
                <label class="span2">Password
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit">Login</button>
            </form>
        </section>
    </main>
</body>
</html>
